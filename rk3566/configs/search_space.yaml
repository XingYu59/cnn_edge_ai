# 搜索空间配置: 网格枚举生成候选模型 (Task 第13/14节)
search_space:
  depth: [3, 4, 5, 6]
  kernel_size: [3, 5]
  channels:
    - [16, 32, 32]
    - [16, 32, 64]
    - [32, 32, 64, 64]
    - [32, 64, 64, 128]
    - [32, 32, 64, 64, 128]

# 所有候选共用的模型参数
num_classes: 43
input_size: 64

training:
  batch_size: 128
  epochs: 30            # 正式实验: 30 epochs (与 model.yaml 一致, 可公平对比)
  learning_rate: 0.001
  optimizer: adam
  num_workers: 2

dataset:
  root: ./data/GTSRB
  val_ratio: 0.2
  # max_rows: 5000      # 调试时可限制样本数, 正式实验请注释掉

seed: 42
